<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小寫</title>
<style>
:root{--bg:#fbfaf7;--panel:#fff;--ink:#1d1b16;--mute:#77726a;--line:#e8e4dc;--me:#1d1b16;--me-ink:#fbfaf7;--accent:#b4532a;--flag:#fde3d6;--ok:#2f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#161512;--panel:#1e1c18;--ink:#ece8df;--mute:#9a948a;--line:#33302a;--me:#ece8df;--me-ink:#161512;--accent:#e08a5f;--flag:#5a2f1e;--ok:#7fc4a0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex}
#chat{flex:1 1 0;min-width:0;display:flex;flex-direction:column;height:100%}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
header b{font-size:17px}
header span{color:var(--mute);font-size:13px}
#log{flex:1;overflow-y:auto;padding:24px 20px 8px}
.wrap{max-width:720px;margin:0 auto}
.row{display:flex;margin:0 0 14px;flex-direction:column;align-items:flex-start}
.row.me{align-items:flex-end}
.bubble{max-width:82%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line)}
.me .bubble{background:var(--me);color:var(--me-ink);border-color:var(--me)}
.tag{font-size:11.5px;color:var(--mute);margin:3px 6px 0;font-variant-numeric:tabular-nums}
.meme{max-width:240px;border-radius:14px;margin-top:6px;border:1px solid var(--line);display:block}
.card{margin-top:6px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;font-size:14px}
.card b{display:block}
.card span{color:var(--mute);font-size:12.5px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-right:4px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
form{padding:12px 20px 20px}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 16px}
#in{flex:1;border:0;outline:0;background:transparent;color:inherit;font:inherit;padding:6px 0}
button{font:inherit;border:0;border-radius:16px;padding:6px 16px;background:var(--me);color:var(--me-ink);cursor:pointer}
button:disabled{opacity:.4}
#art{flex:0 0 0;width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;height:100%;transition:flex-basis .35s ease}
#art.open{flex-basis:min(52%,760px)}
#art .top{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab{padding:4px 12px;border-radius:14px;font-size:13.5px;background:transparent;color:var(--mute);border:1px solid var(--line)}
.tab.on{background:var(--me);color:var(--me-ink);border-color:var(--me)}
#close{margin-left:auto;background:transparent;color:var(--mute);padding:4px 8px}
#meter{padding:10px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#meter b{color:var(--ink);font-weight:600}
#meter .bad b{color:var(--accent)}#meter .good b{color:var(--ok)}
#doc{flex:1;overflow-y:auto;padding:28px 36px 60px;white-space:pre-wrap;font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;line-height:1.95}
#doc h1{font-size:24px;line-height:1.4;margin:0 0 18px;font-weight:700}
#empty{padding:18vh 0 0;text-align:center}
#empty h2{font-size:26px;margin:0 0 8px;font-weight:700}
#empty p{color:var(--mute);margin:0 0 22px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:14.5px}
mark{background:var(--flag);color:inherit;border-radius:3px;padding:0 2px}
u{text-decoration:underline wavy var(--accent);text-underline-offset:5px;text-decoration-thickness:1px}
@media (max-width:820px){body{flex-direction:column}#art.open{flex-basis:60%;width:100%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<section id="chat">
  <header><b>小寫</b><span>聊天 · 寫東西</span></header>
  <div id="log"><div class="wrap" id="msgs">
    <div id="empty">
      <h2>嗨，我是小寫</h2>
      <p>想聊什麼都可以。要寫東西的時候跟我說一聲，文章會開在右邊。</p>
      <div class="chips">
        <button type="button" class="chip">今天加班到九點，好累喔</button>
        <button type="button" class="chip">週末去哪裡走走好</button>
        <button type="button" class="chip">幫我寫一篇關於台北雨天的短文</button>
      </div>
    </div>
  </div></div>
  <form id="f"><div class="box"><input id="in" autocomplete="off" placeholder="說點什麼，或是叫我寫一篇…" autofocus><button id="send">送出</button></div></form>
</section>
<aside id="art">
  <div class="top">
    <button class="tab on" data-v="ours">小寫的版本</button>
    <button class="tab" data-v="base">沒有控制的版本</button>
    <button id="close" aria-label="關閉">✕</button>
  </div>
  <div id="meter"></div>
  <div id="doc"></div>
</aside>
<script>
const $ = s => document.querySelector(s), msgs = $('#msgs'), log = $('#log');
let history = [], lastMeme = false, view = 'ours', art = {ours: null, base: null, rounds: []};

function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function row(cls, html){const d = document.createElement('div'); d.className = 'row ' + cls; d.innerHTML = html; msgs.appendChild(d); log.scrollTop = log.scrollHeight; return d}
function docHtml(text){
  const t = esc(text.trim()).replace(/【/g, '<mark>').replace(/】/g, '</mark>').replace(/〔/g, '<u>').replace(/〕/g, '</u>');
  const i = t.indexOf('\n');
  const title = (i < 0 ? t : t.slice(0, i)).replace(/^#+\s*/, '').replace(/\*\*/g, '');
  return '<h1>' + title + '</h1>' + (i < 0 ? '' : t.slice(i + 1).replace(/^\n+/, ''));
}
function render(){
  const a = art[view], m = $('#meter'), d = $('#doc');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  if (!a){ m.innerHTML = ''; d.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>'; return }
  const c = a.check, bad = c.flagged > 0;
  let h = `<span class="${bad ? 'bad' : 'good'}">像機器的用詞 <b>${c.flagged}</b> 處</span>`;
  if (c.shape.machine_like_sentences != null) h += `<span class="${c.flow ? 'bad' : 'good'}">機器句型 <b>${c.shape.machine_like_sentences}</b> 句</span>`;
  if (c.shape.len_sd != null) h += `<span>句長起伏 <b>${c.shape.len_sd}</b></span>`;
  if (view === 'ours') h += `<span>改寫 <b>${art.rounds.length}</b> 輪${art.rounds.length ? '（' + art.rounds.join(' → ') + ' → ' + c.flagged + '）' : ''}</span>`;
  if (bad) h += `<span>${c.hits.slice(0, 8).map(x => esc(x.gram)).join('、')}</span>`;
  m.innerHTML = h;
  d.innerHTML = docHtml(a.marked || a.text);
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { view = b.dataset.v; render() });
$('#close').onclick = () => $('#art').classList.remove('open');

async function send(text){
  const em = $('#empty'); if (em) em.remove();
  history.push({role: 'user', content: text});
  row('me', `<div class="bubble">${esc(text)}</div>`);
  const wait = row('', '<div class="bubble dots"><span></span><span></span><span></span></div>');
  $('#send').disabled = true;
  const t0 = performance.now();
  let model = '', said = false;
  const res = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: history})});
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    let i; while ((i = buf.indexOf('\n\n')) >= 0) {
      const ev = JSON.parse(buf.slice(5, i)); buf = buf.slice(i + 2);
      if (ev.type === 'route') model = ev.model;
      else if (ev.type === 'artifact_open') { art = {ours: null, base: null, rounds: []}; view = 'ours'; $('#art').classList.add('open'); render() }
      else if (ev.type === 'message') {
        wait.remove(); said = true;
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        let h = `<div class="bubble">${esc(ev.text)}</div>`;
        if (ev.meme) h += `<img class="meme" src="${ev.meme.url}" alt="${esc(ev.meme.alt)}">`;
        h += `<div class="tag">${esc(model)} · ${secs}s</div>`;
        row('', h); history.push({role: 'assistant', content: ev.text}); lastMeme = !!ev.meme;
      }
      else if (ev.type === 'draft' || ev.type === 'repair') { if (ev.check.flagged) art.rounds.push(ev.check.flagged); art.ours = ev; if (view === 'ours') render() }
      else if (ev.type === 'final') {
        art.ours = ev; render();
        const title = ev.text.trim().split('\n')[0].replace(/^#+\s*/, '');
        const card = row('', `<div class="card"><b>${esc(title)}</b><span>${ev.text.length} 字 · 像機器的用詞 ${ev.check.flagged} 處 · 點一下打開</span></div><div class="tag">${esc(model)} · ${((performance.now() - t0) / 1000).toFixed(0)}s</div>`);
        card.querySelector('.card').onclick = () => { $('#art').classList.add('open'); view = 'ours'; render() };
        history.push({role: 'assistant', content: '（文章寫好了：' + title + '）'});
      }
      else if (ev.type === 'baseline') { art.base = ev; if (view === 'base') render() }
      else if (ev.type === 'error') { wait.remove(); row('', `<div class="bubble">出錯了：${esc(ev.text)}</div>`) }
    }
  }
  if (!said) wait.remove();
  $('#send').disabled = false; $('#in').focus();
}
document.querySelectorAll('.chip').forEach(b => b.onclick = () => { if (!$('#send').disabled) send(b.textContent) });
$('#f').onsubmit = e => { e.preventDefault(); const v = $('#in').value.trim(); if (!v || $('#send').disabled) return; $('#in').value = ''; send(v) };
</script>
</body>
</html>
